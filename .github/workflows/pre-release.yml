name: Publish Prompt AI preview release

on:
  push:
    tags:
      - 'v*-preview.*'

jobs:
  release:
    name: Build Full preview APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Install Android NDK
        run: echo "y" | sudo "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Full preview APK
        run: ./gradlew assembleFullRelease --stacktrace

      - name: Upload Full APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PromptAI-${{ github.ref_name }}-Full-unsigned
          path: app/build/outputs/apk/full/release/app-full-release-unsigned.apk
          if-no-files-found: error
