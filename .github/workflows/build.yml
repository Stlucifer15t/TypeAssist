name: Prompt AI Build

on:
  push:
    branches:
      - master
      - arena/*
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.number || '' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Install Android NDK
        run: echo "y" | sudo "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew test --stacktrace 2>&1 | tee test.log

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            test.log
            app/build/reports/tests
          if-no-files-found: warn

      - name: Build Full release variant
        run: ./gradlew assembleFullRelease --stacktrace 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload Full APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PromptAI-Full-unsigned
          path: app/build/outputs/apk/full/release/app-full-release-unsigned.apk
          if-no-files-found: error

      # TEMPORARY diagnostic: surfaces build failures as annotations we can read
      - name: Diagnose missing APK
        if: failure()
        run: |
          {
            echo "=== apk files ==="
            find app/build/outputs/apk -type f -name "*.apk" 2>/dev/null || echo "(none)"
            echo "=== gradle test result ==="
            grep -E "^(e: |w: )|FAILURE:|What went wrong|Execution failed|BUILD SUCCESSFUL|BUILD FAILED" build.log 2>/dev/null | head -25 || echo "(no build.log)"
            echo "=== build.log tail ==="
            tail -12 build.log 2>/dev/null || true
          } > diag.txt
          while IFS= read -r line; do
            echo "::error::${line//%/\%25}"
          done < diag.txt
