name: Prompt AI Build

on:
  push:
    branches:
      - master
      - arena/*
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.number || '' }}
  cancel-in-progress: true

# TEMPORARY (removed once build is green): lets the diagnostic step post a commit comment.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Install Android NDK
        run: echo "y" | sudo "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Full release variant
        run: ./gradlew assembleFullRelease --stacktrace 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      # TEMPORARY DIAGNOSTIC (removed once build is green): sandbox cannot read artifact blobs.
      - name: Publish build diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "== apk outputs =="
            ls -R app/build/outputs/apk 2>/dev/null || echo "(no apk dir)"
            echo "== kotlinc errors =="
            grep -E "^e: |error:" build.log | head -60 || echo "(none)"
            echo "== result =="
            grep -E "BUILD (SUCCESSFUL|FAILED)" build.log || true
          } > /tmp/tail.txt
          jq -Rs '{body: ("CI diagnostics\n```\n" + . + "\n```")}' /tmp/tail.txt > /tmp/payload.json
          gh api --method POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" --input /tmp/payload.json || true

      - name: Upload Full APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PromptAI-Full-unsigned
          path: app/build/outputs/apk/full/release/app-full-release-unsigned.apk
          if-no-files-found: error
