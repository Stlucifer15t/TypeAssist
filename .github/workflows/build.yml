name: Prompt AI Build

on:
  push:
    branches:
      - master
      - arena/*
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.number || '' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Install Android NDK
        run: echo "y" | sudo "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Full release variant
        run: |
          set -o pipefail
          ./gradlew assembleFullRelease --stacktrace 2>&1 | tee build.log
          exit_code=$?
          if [ $exit_code -ne 0 ]; then
            {
              grep -E "^e: |error:|Caused by|FAILURE:|What went wrong|Execution failed for task" build.log | head -40
              echo "----- last 40 lines -----"
              tail -40 build.log
            } | while IFS= read -r line; do
              echo "::error::${line:0:400}"
            done
          fi
          exit $exit_code

      - name: Verify APK signature
        if: success()
        run: |
          APK=$(ls app/build/outputs/apk/full/release/*.apk | head -n 1)
          echo "Verifying $APK"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --print-certs "$APK"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload Full APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PromptAI-Full
          path: app/build/outputs/apk/full/release/*.apk
          if-no-files-found: error
