name: Prompt AI Build

on:
  push:
    branches:
      - master
      - arena/*
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.number || '' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Install Android NDK
        run: echo "y" | sudo "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Full release variant
        run: |
          set -o pipefail
          ./gradlew assembleFullRelease --stacktrace 2>&1 | tee build.log
          exit_code=$?
          if [ $exit_code -ne 0 ]; then
            {
              grep -E "^e: |error:|Caused by|FAILURE:|What went wrong|Execution failed for task" build.log | head -40
              echo "----- last 40 lines -----"
              tail -40 build.log
            } | while IFS= read -r line; do
              echo "::error::${line:0:400}"
            done
          fi
          exit $exit_code

      - name: Export failure log to branch
        if: failure()
        run: |
          {
            echo "=== filtered errors ==="
            grep -nE "^e: |error:|Caused by|What went wrong|Execution failed for task|FAILURE" build.log | head -120 || true
            echo "=== last 80 lines ==="
            tail -n 80 build.log
          } > ci-errors.log
          git config user.name "ci-log-bot"
          git config user.email "ci-log-bot@users.noreply.github.com"
          git add ci-errors.log
          git commit -m "CI failure diagnostics (auto-generated)" || echo "nothing to commit"
          git push origin "HEAD:${{ github.ref_name }}" || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload Full APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PromptAI-Full-unsigned
          path: app/build/outputs/apk/full/release/app-full-release-unsigned.apk
          if-no-files-found: error
