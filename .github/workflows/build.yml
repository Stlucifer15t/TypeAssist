name: Prompt AI Build

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Install Android NDK
        run: echo "y" | sudo "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Full release variant
        run: ./gradlew assembleFullRelease --stacktrace

      - name: Upload Full APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PromptAI-Full-unsigned
          path: app/build/outputs/apk/full/release/app-full-release-unsigned.apk
          if-no-files-found: error
