name: Prompt AI Build

on:
  push:
    branches:
      - master
      - arena/*
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.number || '' }}
  cancel-in-progress: true

# TEMPORARY: allows the diagnostic step to post the build log as a commit comment.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Install Android NDK
        run: echo "y" | sudo "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Full release variant
        run: ./gradlew assembleFullRelease --stacktrace 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      # TEMPORARY DIAGNOSTIC: sandbox cannot read artifact blobs, so post the log tail as a commit comment.
      - name: Publish build log tail if APK missing
        if: always()
        run: |
          if [ ! -f app/build/outputs/apk/full/release/app-full-release-unsigned.apk ]; then
            tail -c 5500 build.log > /tmp/build_tail.txt || true
            jq -Rs '{body: ("CI build log tail\n```\n" + . + "\n```")}' /tmp/build_tail.txt > /tmp/payload.json
            curl -sS -X POST "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              --data-binary @/tmp/payload.json || true
          fi

      - name: Upload Full APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PromptAI-Full-unsigned
          path: app/build/outputs/apk/full/release/app-full-release-unsigned.apk
          if-no-files-found: error
