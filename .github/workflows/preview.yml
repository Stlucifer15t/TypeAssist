name: Prompt AI Preview Build & Deploy

permissions:
  contents: read
  pages: write
  id-token: write

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      commit_count: ${{ steps.set_commit.outputs.commit_count }}
      build_time: ${{ steps.set_commit.outputs.build_time }}
      apk_size: ${{ steps.set_commit.outputs.apk_size }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Install Android NDK
        run: echo "y" | sudo "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Full release APK
        run: ./gradlew assembleFullRelease

      - name: Sign and verify Full APK
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.ALIAS }}
          SIGNING_KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          release_keystore="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$release_keystore"' EXIT

          if [[ -z "$SIGNING_KEY_BASE64" || -z "$SIGNING_KEY_ALIAS" || -z "$SIGNING_KEY_STORE_PASSWORD" || -z "$SIGNING_KEY_PASSWORD" ]]; then
            echo "Required signing secrets are missing: SIGNING_KEY_BASE64, ALIAS, KEY_STORE_PASSWORD, KEY_PASSWORD" >&2
            exit 1
          fi
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$release_keystore"

          apksigner="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          release_dir="app/build/outputs/apk/full/release"
          unsigned_apk="$release_dir/app-full-release-unsigned.apk"
          signed_apk="$release_dir/app-full-release.apk"

          if [[ ! -f "$unsigned_apk" ]]; then
            echo "APK not found: $unsigned_apk" >&2
            ls -lah "$release_dir"
            exit 1
          fi

          "$apksigner" sign \\
            --ks "$release_keystore" \\
            --ks-key-alias "$SIGNING_KEY_ALIAS" \\
            --ks-pass "pass:$SIGNING_KEY_STORE_PASSWORD" \\
            --key-pass "pass:$SIGNING_KEY_PASSWORD" \\
            --out "$signed_apk" \\
            "$unsigned_apk"
          "$apksigner" verify "$signed_apk"
          ls -lh "$signed_apk"

      - name: Collect preview APK
        id: set_commit
        run: |
          set -euo pipefail
          commit_count=$(git rev-list --count HEAD)
          build_time=$(date -u +"%Y-%m-%d %H:%M UTC")
          apk="app/build/outputs/apk/full/release/app-full-release.apk"
          destination="output/PromptAI-preview-r${commit_count}.apk"

          if [[ ! -f "$apk" ]]; then
            echo "Signed Full APK not found: $apk" >&2
            ls -R app/build/outputs/apk/full/release
            exit 1
          fi

          mkdir -p output
          cp "$apk" "$destination"
          echo "commit_count=$commit_count" >> "$GITHUB_OUTPUT"
          echo "build_time=$build_time" >> "$GITHUB_OUTPUT"
          echo "apk_size=$(du -h "$destination" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload preview APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-apk
          path: output/PromptAI-preview-r${{ steps.set_commit.outputs.commit_count }}.apk
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download preview APK artifact
        uses: actions/download-artifact@v4
        with:
          name: preview-apk
          path: ./public

      - name: Generate download page
        run: |
          commit_count="${{ needs.build.outputs.commit_count }}"
          build_time="${{ needs.build.outputs.build_time }}"
          echo "<!DOCTYPE html>
          <html lang='en'>
          <head>
            <meta charset='UTF-8'>
            <meta name='viewport' content='width=device-width, initial-scale=1.0'>
            <title>Prompt AI Preview Builds</title>
            <style>
              body { font-family: sans-serif; padding: 2em; background: #0d1117; color: #c9d1d9; }
              h1 { color: #58a6ff; }
              a { color: #58a6ff; text-decoration: none; display: block; margin: 8px 0; }
              a:hover { text-decoration: underline; }
              .note { color: #8b949e; font-size: 0.9em; margin-top: 1em; }
            </style>
          </head>
          <body>
            <h1>Prompt AI Preview Build r${commit_count}</h1>
            <p>Build time: ${build_time}</p>
            <p>Download the latest signed Full APK:</p>
            <ul>
              <li><a href='PromptAI-preview-r${commit_count}.apk'>Download APK (${{ needs.build.outputs.apk_size }})</a></li>
            </ul>
            <p class='note'>Built from the selected branch.</p>
          </body>
          </html>" > ./public/index.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy GitHub Pages site
        uses: actions/deploy-pages@v4
