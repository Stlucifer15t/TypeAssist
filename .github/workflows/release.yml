name: Publish Prompt AI release

on:
  push:
    tags:
      - 'v*'

# Needed so the build job can attach the APK to the GitHub release.
permissions:
  contents: write

jobs:
  release:
    if: ${{ !contains(github.ref_name, '-preview.') }}
    name: Build Full APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Install Android NDK
        run: echo "y" | sudo "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Full release APK
        run: ./gradlew assembleFullRelease --stacktrace

      - name: Upload Full APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PromptAI-${{ github.ref_name }}-Full-unsigned
          path: app/build/outputs/apk/full/release/app-full-release-unsigned.apk
          if-no-files-found: error

      - name: Attach APK to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            app/build/outputs/apk/full/release/app-full-release-unsigned.apk \
            --clobber || echo "::warning::Release ${GITHUB_REF_NAME} not found yet; APK stays available as an Actions artifact."
