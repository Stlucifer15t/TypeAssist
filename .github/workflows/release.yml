name: Publish Prompt AI release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    if: ${{ !contains(github.ref_name, '-preview.') }}
    name: Build and sign Full APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Install Android NDK
        run: echo "y" | sudo "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Full release APK
        run: ./gradlew assembleFullRelease --stacktrace

      - name: Validate and set release tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable release tag like v4.2.0; got $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "VERSION_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Sign and verify APK
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.ALIAS }}
          SIGNING_KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          unsigned_apk="app/build/outputs/apk/full/release/app-full-release-unsigned.apk"
          signed_apk="app/build/outputs/apk/full/release/PromptAI-${VERSION_TAG}.apk"
          release_keystore="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$release_keystore"' EXIT

          if [[ -z "$SIGNING_KEY_BASE64" || -z "$SIGNING_KEY_ALIAS" || -z "$SIGNING_KEY_STORE_PASSWORD" || -z "$SIGNING_KEY_PASSWORD" ]]; then
            echo "Required signing secrets are missing: SIGNING_KEY_BASE64, ALIAS, KEY_STORE_PASSWORD, KEY_PASSWORD" >&2
            exit 1
          fi
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$release_keystore"

          apksigner="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          "$apksigner" sign \
            --ks "$release_keystore" \
            --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --ks-pass "pass:$SIGNING_KEY_STORE_PASSWORD" \
            --key-pass "pass:$SIGNING_KEY_PASSWORD" \
            --out "$signed_apk" \
            "$unsigned_apk"
          "$apksigner" verify "$signed_apk"
          sha256sum "$signed_apk" | awk '{ print $1 }' > "$RUNNER_TEMP/apk.sha256"
          echo "APK_SHA256=$(cat "$RUNNER_TEMP/apk.sha256")" >> "$GITHUB_ENV"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Prompt AI ${{ github.ref_name }}
          body: |
            ### APK checksum

            SHA-256: `${{ env.APK_SHA256 }}`
          files: app/build/outputs/apk/full/release/PromptAI-${{ github.ref_name }}.apk
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
