# detekt configuration for TypeAssist / Prompt AI.
#
# Build on detekt's defaults, then relax the rules that fight this codebase's
# established patterns so the report points at real issues, not noise:
#  * Compose screens are intentionally long, single-purpose functions, and the
#    older screens (ProviderSettings, onAccessibilityEvent) carry a lot of
#    accumulated branching. Restructuring them is its own project, so the
#    structural complexity rules are off until then.
#  * Overlay/layout code needs literal dimensions.
#  * Gson ignores serialVersionUID, so the Serializable marker classes do not
#    need one.
#  * Empty catches are the codebase's deliberate "best effort" pattern for
#    overlay and platform calls that must never crash the service.
# Re-enable rules as findings are fixed; keep `maxIssues` as the gate.
build:
  maxIssues: 0

complexity:
  LongMethod:
    active: false
  LongParameterList:
    active: false
  LargeClass:
    active: false
  TooManyFunctions:
    active: false
  CyclomaticComplexMethod:
    # Legacy: the Compose screens and the accessibility event handler are
    # single-purpose functions with decades of accumulated branching.
    active: false
  NestedBlockDepth:
    active: false
  ComplexCondition:
    active: false

exceptions:
  SwallowedException:
    active: false
  TooGenericExceptionCaught:
    active: false
  PrintStackTrace:
    active: true
  TooGenericExceptionThrown:
    # The calculator throws RuntimeException for bad input; specific exceptions
    # to come with the calculator rewrite.
    active: false

empty-blocks:
  EmptyCatchBlock:
    # Deliberate pattern: platform and overlay calls wrapped in try/catch so a
    # vendor quirk cannot crash the service. The catch is the whole point.
    active: false

naming:
  FunctionNaming:
    # Composable functions are PascalCase by convention.
    active: false
  TopLevelPropertyNaming:
    active: false
  VariableNaming:
    active: false
  MatchingDeclarationName:
    active: false

style:
  MagicNumber:
    active: false
  MaxLineLength:
    # Long one-line strings (command templates, test data) are the norm here;
    # wrapping them hurts more than the length does.
    active: false
  WildcardImport:
    excludeImports:
      - okhttp3.*
      - java.util.*
  ReturnCount:
    active: false
  LoopWithTooManyJumpStatements:
    # The trigger-matching loops read as "find the first trigger that qualifies
    # and act on it"; the extra jumps are the readability here.
    active: false
  ThrowsCount:
    active: false
  UnusedPrivateMember:
    ignoreAnnotated:
      - 'Preview'

serialization:
  SerialVersionUIDInSerializableClass:
    # These classes are serialized by Gson, which ignores serialVersionUID.
    active: false

unused:
  UnusedPrivateProperty:
    active: true
  UnusedParameter:
    active: true
