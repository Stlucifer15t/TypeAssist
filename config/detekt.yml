# detekt configuration for TypeAssist / Prompt AI.
#
# Build on detekt's defaults, then relax the rules that fight this codebase's
# established patterns so the report points at real issues, not noise:
#  * Compose screens are intentionally long, single-purpose functions.
#  * Screen callbacks legitimately take many parameters.
#  * Overlay/layout code needs literal dimensions.
# Re-enable rules as findings are fixed; keep `maxIssues` as the gate.
build:
  maxIssues: 0

complexity:
  LongMethod:
    active: false
  LongParameterList:
    active: false
  LargeClass:
    active: false
  TooManyFunctions:
    active: false
  CyclomaticComplexMethod:
    threshold: 25
  NestedBlockDepth:
    threshold: 6

exceptions:
  SwallowedException:
    active: false
  TooGenericExceptionCaught:
    active: false
  PrintStackTrace:
    active: true

naming:
  FunctionNaming:
    # Composable functions are PascalCase by convention.
    active: false
  TopLevelPropertyNaming:
    active: false
  VariableNaming:
    active: false

style:
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 140
  WildcardImport:
    excludeImports:
      - okhttp3.*
      - java.util.*
  ReturnCount:
    active: false
  UnusedPrivateMember:
    ignoreAnnotated:
      - 'Preview'

comments:
  CommentOverPrivateFunction:
    active: false
  UndocumentedPublicClass:
    active: false
  UndocumentedPublicFunction:
    active: false
