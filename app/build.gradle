plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.0.0'
    alias(libs.plugins.detekt)
}

// Keep local signing credentials out of source control. CI supplies these values
// through environment variables; developers can use an ignored keystore.properties file.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { stream -> keystoreProperties.load(stream) }
}
def releaseStoreFile = System.getenv("ANDROID_KEYSTORE_PATH") ?: keystoreProperties.getProperty("storeFile")
def releaseStoreType = System.getenv("ANDROID_KEYSTORE_TYPE") ?: keystoreProperties.getProperty("storeType") ?: "JKS"
def releaseStorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: keystoreProperties.getProperty("storePassword")
def releaseKeyAlias = System.getenv("ANDROID_KEY_ALIAS") ?: keystoreProperties.getProperty("keyAlias")
def releaseKeyPassword = System.getenv("ANDROID_KEY_PASSWORD") ?: keystoreProperties.getProperty("keyPassword")
def releaseSigningConfigured = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
        .every { value -> value != null && !value.toString().trim().isEmpty() }

android {
    namespace = 'com.typeassist.app'
    compileSdk = 35


    defaultConfig {
        applicationId = "com.typeassist.app"
        minSdk = 24
        targetSdk = 35
        versionCode = 32
        versionName = "4.9.6"
        vectorDrawables {
            useSupportLibrary = true
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -O3"
                arguments "-DCMAKE_BUILD_TYPE=Release"
            }
        }
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    flavorDimensions = ["distribution"]
    productFlavors {
        full {
            dimension = "distribution"
            buildConfigField "boolean", "SHOW_UPDATES", "true"
        }
        fdroid {
            dimension = "distribution"
            buildConfigField "boolean", "SHOW_UPDATES", "false"
        }
    }

    // Disable splits as we only target arm64-v8a now
    splits {
        abi {
            enable = false
        }
    }

    externalNativeBuild {
        cmake {
            path = "src/main/cpp/CMakeLists.txt"
            version = "3.22.1"
        }
    }

    ndkVersion = "27.0.12077973"

    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
                storeFile = file(releaseStoreFile)
                storePassword = releaseStorePassword
                storeType = releaseStoreType
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix = ".debug"
            versionNameSuffix = "-debug"
        }
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseSigningConfigured) {
                signingConfig = signingConfigs.release
            }
        }
    }
/*
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
*/
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    composeOptions {
        // Version handled by plugin
    }
}

detekt {
    buildUponDefaultConfig = true
    config.setFrom(files("$rootDir/config/detekt.yml"))
    parallel = true
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx

    // --- JETPACK COMPOSE ---
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.activity.compose
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation libs.material

    // Icons
    implementation 'androidx.compose.material:material-icons-extended'
    implementation libs.androidx.core.splashscreen

    // Navigation
    implementation libs.androidx.navigation.compose

    // Networking & JSON
    implementation libs.squareup.okhttp3.okhttp
    implementation libs.squareup.retrofit2.retrofit
    implementation libs.squareup.retrofit2.converter.gson
    implementation libs.google.code.gson.gson

    // Markdown rendering for release notes
    implementation libs.compose.markdown

    // Testing
    testImplementation libs.junit.junit
    // The API clients use Android's org.json; in JVM tests that class is only a stub that throws,
    // so the real implementation is put on the unit-test classpath instead.
    testImplementation libs.org.json.json
    // MockWebServer needs no device, so the API client tests run as plain unit tests.
    testImplementation libs.squareup.okhttp3.mockwebserver
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.test.espresso.espresso.core
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
